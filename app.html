<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CFA Level II Study · Study Map</title>
<link rel="stylesheet" href="static/site.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="static/icon-180.png">
<link rel="icon" href="static/icon-192.png">
<meta name="theme-color" content="#16181f">
<script src="static/lock-config.js"></script>
<script src="static/lock.js"></script>
<script src="static/profile.js"></script>
<script>StudyProfile.guard();</script>
<link rel="stylesheet" href="static/katex/katex.min.css">
<link rel="stylesheet" href="static/path.css">
<script defer src="static/katex/katex.min.js"></script>
<script defer src="static/katex/contrib/auto-render.min.js"></script>
<style>
  /* colours come from static/site.css; only the diagram's edge colour and the pop-up shadow are page-specific */
  :root { --page-max: 1280px; --edge: #b9b5ab; --header-bg: var(--bar-bg); --stick: 64px;
          --pop-shadow: 0 14px 36px rgba(29, 29, 27, .18), 0 2px 6px rgba(29, 29, 27, .08); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --edge: #57544e; --pop-shadow: 0 14px 40px rgba(0, 0, 0, .6); } }
  :root[data-theme="dark"] { --edge: #57544e; --pop-shadow: 0 14px 40px rgba(0, 0, 0, .6); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }  /* chips and buttons set their own display; hidden must still win */
  html { overflow-x: hidden; }  /* on the root only: on body too it would make body the scroller */
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; }
  /* top bar */
  .top { position: sticky; top: 0; z-index: 20; background: var(--header-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
         border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
  .top h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); margin: 0; white-space: nowrap; }
  .top h1 a { color: inherit; text-decoration: none; }
  .navbtn { display: none; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
            padding: 5px 12px; min-height: 34px; font-size: 14px; cursor: pointer; }
  .seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
  .seg a { display: inline-flex; align-items: center; min-height: 30px; padding: 3px 14px; border-radius: 999px; font-size: 14px; font-weight: 600;
           color: var(--muted); text-decoration: none; }
  .seg a:hover { color: var(--ink); }
  .seg a[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
  .whereami { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .whereami:empty { display: none; }
  .search { position: relative; flex: 1 1 240px; max-width: 520px; min-width: 0; }
  .search input { width: 100%; font-size: 16px; padding: 8px 14px 8px 36px; border-radius: 999px; border: 1px solid var(--line-strong);
                  background: var(--card); color: var(--ink); outline: none; -webkit-appearance: none; appearance: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search::before { content: "⌕"; position: absolute; left: 13px; top: 50%; transform: translateY(-52%); color: var(--muted); font-size: 18px; pointer-events: none; }
  .results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
             box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: 60vh; overflow-y: auto; display: none; padding: 6px; z-index: 30; }
  .results.show { display: block; }
  .results a { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
  .results a:hover, .results a.sel { background: var(--accent-soft); }
  .results .rt { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); flex: 0 0 62px; }
  .results .rl { flex: 1; min-width: 0; }
  .results .rm { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .results .empty { padding: 10px; color: var(--muted); font-size: 14px; }
  .toplinks { display: flex; gap: 14px; align-items: center; margin-left: auto; font-size: 14px; }
  .toplinks a { text-decoration: none; white-space: nowrap; }
  .live { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .live i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }
  .live.stale i { background: var(--bad); }
  .top-prog { height: 3px; }
  .top-prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  /* layout */
  .layout { max-width: 1280px; margin: 0 auto; padding: 18px 16px 56px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 22px; align-items: start; }
  nav#nav { position: sticky; top: calc(var(--stick) + 8px); max-height: calc(100vh - var(--stick) - 16px); overflow-y: auto; font-size: 14px; padding-right: 4px; }
  nav .home { display: block; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
  nav details { border-radius: 10px; margin-bottom: 2px; }
  nav summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: 8px; font-weight: 600; }
  nav summary::-webkit-details-marker { display: none; }
  nav summary::after { content: "›"; margin-left: auto; color: var(--muted); transition: transform .2s; }
  nav details[open] summary::after { transform: rotate(90deg); }
  nav summary:hover, nav .home:hover, nav .mods a:hover { background: var(--card); }
  .vn { flex: 0 0 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  nav .cnt { font-size: 11px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  nav .mods { padding: 2px 0 8px 20px; display: grid; gap: 1px; }
  nav .mods a { display: flex; gap: 8px; align-items: baseline; padding: 4px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
  nav .mods a.diagram { color: var(--accent); font-weight: 600; font-size: 13px; }
  nav .mods a .mn { color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 14px; font-size: 12px; }
  nav .mods a .mt { flex: 1; min-width: 0; }
  nav .mods a .b { font-size: 10px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  nav .mods a .ok { font-size: 12px; color: var(--good); font-weight: 700; }
  nav .mods a .nr { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; align-self: center; opacity: .7; }
  nav .mods a.off .mt { color: var(--muted); }
  nav a.cur, nav .home.cur { background: var(--accent-soft) !important; color: var(--accent); font-weight: 600; }
  nav .toc-prog { padding: 2px 10px 10px; font-size: 12px; color: var(--muted); }
  nav .toc-prog .progress { margin-top: 5px; }
  nav .sep { height: 1px; background: var(--line); margin: 8px 10px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    nav#nav { display: none; position: static; max-height: none; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    body.navopen nav#nav { display: block; }
    .navbtn { display: inline-flex; }
    .toplinks .live { display: none; }
  }
  @media (max-width: 560px) {
    .search { order: 5; flex-basis: 100%; max-width: none; }
    .seg { margin-left: auto; }
    .whereami { display: none; }
  }
  @media (max-width: 400px) { .navbtn .nb-l { display: none; } .seg a { padding: 3px 11px; } }
  /* content */
  #content { min-width: 0; }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .crumbs a { color: var(--muted); }
  h2 { font-size: clamp(24px, 3vw, 32px); line-height: 1.2; margin: 0 0 8px; }
  h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 30px 0 10px; display: flex; align-items: center; gap: 8px; }
  h3 .count { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 0 8px; font-size: 12px; letter-spacing: 0; }
  .lede { font-size: 17px; max-width: 760px; margin: 8px 0 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
  .badge b { color: var(--ink); }
  .badge.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .badge.good b { color: var(--good); }
  .badge.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .badge.warn b { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .vcard { text-decoration: none; color: var(--ink); display: block; transition: border-color .2s, transform .2s; }
  .vcard:hover { border-color: var(--accent); }
  .vcard .vh { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 17px; }
  .vcard p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .meter { height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 10px; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s; }
  .empty-note { border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: 15px; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .pager a { font-size: 14px; text-decoration: none; border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 999px; max-width: 48%;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* concepts */
  .concepts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .concept h4 { margin: 0 0 4px; font-size: 16px; }
  .concept p { margin: 0; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; align-items: center; }
  .chips .lbl { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-decoration: none; max-width: 100%;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.chip:hover { outline: 1.5px solid var(--accent); }
  .chip.l1 { background: var(--bg); color: var(--muted); }
  .chip.out { background: var(--pc-soft); color: var(--pc); }
  .chip.plain { background: var(--bg); color: var(--ink); }
  .flash { animation: flash 2.2s ease-out; }
  @keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
  /* connects */
  .connects { display: grid; gap: 8px; }
  .connect { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 12px; align-items: baseline; font-size: 15px; }
  @media (max-width: 560px) { .connect { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
  /* formulas */
  .fcards { display: grid; gap: 12px; }
  .fcard { border-left: 4px solid var(--accent); }
  .fcard .fh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .fcard .fh h4 { margin: 0; font-size: 16px; }
  .fid { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .ftex { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
  .spoken { font-size: 13px; color: var(--muted); font-style: italic; margin: 0 0 6px; }
  .where { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 3px 18px; margin: 4px 0 8px; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
  .where b { color: var(--ink); font-weight: 400; margin-right: 6px; }
  .fline { margin: 6px 0 0; font-size: 15px; }
  .fline > b:first-child { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
  .pitfall { margin-top: 10px; background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .pitfall > b:first-child { color: var(--warn); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin-right: 6px; }
  .example { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  .example > b:first-child, .example > summary b { color: var(--accent); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; margin-right: 6px; }
  .example > summary { cursor: pointer; list-style: none; min-height: 28px; display: flex; align-items: center; }
  .example > summary::-webkit-details-marker { display: none; }
  .example > summary::after { content: "Show"; margin-left: auto; font-size: 13px; color: var(--accent); }
  .example[open] > summary::after { content: "Hide"; }
  .example p { margin: 4px 0; }
  .example .res { font-weight: 600; margin-top: 4px; }
  .std { border-left: 4px solid var(--pc); }
  .std .fid { font-size: 12px; color: var(--pc); font-weight: 700; font-family: inherit; }
  /* study guide Q&A */
  .qa { padding: 0; overflow: hidden; }
  .qa summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .qa summary::-webkit-details-marker { display: none; }
  .qa .ans { flex: 0 0 auto; font-weight: 700; color: var(--good); background: var(--good-soft); border-radius: 8px; padding: 1px 8px; font-size: 14px; }
  .qa .qt { flex: 1; min-width: 0; font-weight: 600; }
  .qa .body { padding: 0 16px 14px; font-size: 15px; }
  .qa .corr { margin-top: 10px; border-left: 3px solid var(--warn); padding: 4px 12px; background: var(--warn-soft); border-radius: 0 8px 8px 0; }
  .qa .corr b { color: var(--warn); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .qa .corr ul { margin: 4px 0; padding-left: 18px; }
  .qa .by { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .qa .by .mac { color: var(--accent); font-weight: 600; } .qa .by .pc { color: var(--pc); font-weight: 600; }
  .stack { display: grid; gap: 8px; }
  .miss { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .miss li { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
  details.more summary { cursor: pointer; font-size: 14px; color: var(--muted); margin-top: 10px; }
  details.more ul { font-size: 14px; margin: 6px 0; padding-left: 20px; }
  /* diagram */
  .dgwrap { position: relative; margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .dgscroll { overflow: auto; max-height: 76vh; -webkit-overflow-scrolling: touch; border-radius: 14px; cursor: grab; }
  .dgscroll.drag { cursor: grabbing; }
  .dg { display: block; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .dg .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; transition: opacity .2s; }
  .dg .edge.on { stroke: var(--accent); stroke-width: 2; }
  .dg .arr { fill: var(--edge); } .dg .arr-on { fill: var(--accent); }
  .dg .node, .dg .mh { cursor: pointer; transition: opacity .2s; }
  .dg .node rect { fill: var(--card); stroke: var(--line-strong); stroke-width: 1.2; }
  .dg .node text { fill: var(--ink); font-size: 12px; }
  .dg .node:hover rect, .dg .node.on rect, .dg .node:focus rect { stroke: var(--accent); stroke-width: 2; }
  .dg .node.src rect { fill: var(--accent-soft); }
  .dg .tag rect { fill: var(--pc-soft); stroke: none; }
  .dg .tag text { fill: var(--pc); font-size: 10px; font-weight: 700; }
  .dg .mh rect { fill: var(--accent-soft); stroke: none; }
  .dg .mh .k { fill: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
  .dg .mh .t { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .dg .mh:hover rect { fill: var(--accent); } .dg .mh:hover text { fill: var(--card); }
  .dg .none { fill: var(--muted); font-size: 12px; font-style: italic; }
  .dg .lane { fill: var(--bg); opacity: .55; }
  .dg.focus .edge:not(.on) { opacity: .1; }
  .dg.focus .node:not(.on) { opacity: .35; }
  .dglegend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .dglegend .sw { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
  .dglegend .tg { display: inline-block; font-size: 10px; font-weight: 700; color: var(--pc); background: var(--pc-soft); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
  .modlist { display: grid; gap: 8px; }
  .modrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); }
  .modrow:hover { border-color: var(--accent); }
  .modrow .t { font-weight: 600; }
  .modrow .s { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .modrow .badges { margin: 0; justify-content: flex-end; }
  @media (max-width: 640px) { .modrow { grid-template-columns: 34px minmax(0, 1fr); } .modrow .badges { grid-column: 2; justify-content: flex-start; } }
  .offline { color: var(--bad); font-size: 14px; }
  .toguide { margin-top: 10px; }
  /* maths */
  .katex { font-size: 1.1em; }
  .katex-display { margin: .5em 0; padding: .45em .6em; background: var(--bg); border-radius: 8px; overflow-x: auto; overflow-y: hidden; }
  .num { font-family: KaTeX_Main, "Times New Roman", serif; font-size: 1.08em; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
  .tex-raw { font-family: var(--mono); font-size: 13px; background: var(--sunk); border-radius: 6px; padding: 1px 5px; overflow-wrap: anywhere; }
  .tex-raw[data-display] { display: block; white-space: pre-wrap; padding: 6px 10px; margin: .5em 0; }

  /* ================================================================ the Guide */
  .guide { max-width: 820px; }
  .anchor, .sec { scroll-margin-top: calc(var(--stick) + 14px); }
  .guide .chip { padding: 4px 10px; font-size: 13px; }
  .g-where { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
  .g-read { border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; min-height: 32px;
            font-size: 13px; font-weight: 600; cursor: pointer; }
  .g-read.on { background: var(--good-soft); border-color: transparent; color: var(--good); }
  .g-bar { margin-bottom: 14px; }
  .g-secnav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 16px -16px 0; padding: 2px 16px 6px; -webkit-overflow-scrolling: touch; }
  .g-secnav::-webkit-scrollbar { display: none; }
  .g-secnav a { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
                background: var(--card); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; }
  .g-secnav a:hover { border-color: var(--accent); }
  .g-secnav a .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .g-secnav a.narr { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  @media (min-width: 861px) { .g-secnav { flex-wrap: wrap; overflow: visible; margin: 16px 0 0; padding: 0; } }
  .g-prose { font-size: 17px; line-height: 1.6; }
  .rich p { margin: 0 0 .7em; } .rich p:last-child { margin-bottom: 0; }
  .rich ul, .rich ol { margin: .2em 0 .7em; padding-left: 1.3em; } .rich li { margin: .2em 0; }
  .rich .rh { font-weight: 700; margin: .9em 0 .3em; }
  .rich code { font-family: var(--mono); font-size: .9em; background: var(--sunk); border-radius: 4px; padding: 0 4px; }
  .narr-sec { border-left: 3px solid var(--accent-soft); padding-left: 16px; margin-left: -19px; }
  .g-byline { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
  .g-pending { display: flex; gap: 10px; align-items: baseline; margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); color: var(--muted); font-size: 14px; }
  .g-pending .dot { background: var(--accent); flex: none; }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// <mathvars> Plain-text variables (x1i, b0, R2, σ2, e_t, x^2) as proper subscripts/superscripts. Only ever applied OUTSIDE \( \) and \[ \].
const MV_I = 'font-family:KaTeX_Math,Georgia,serif;font-style:italic;font-size:1.08em';
const MV_S = 'font-family:KaTeX_Main,Georgia,serif;font-size:.78em;line-height:0;font-style:normal';
const mvScript = (s) => s.replace(/[-−]/g, "−").replace(/[A-Za-z]/g, '<i style="font-family:KaTeX_Math,serif">$&</i>');
const mvVar = (base, sub, sup) => `<span class="mv" style="white-space:nowrap"><span style="${MV_I}">${base}</span>` +
  (sub ? `<sub style="${MV_S}">${mvScript(sub)}</sub>` : "") + (sup ? `<sup style="${MV_S}">${mvScript(sup)}</sup>` : "") + "</span>";
const MV_END = "(?![\\w\\u0370-\\u03FF]|\\.\\w)";  // not followed by more of a word, a decimal or a file extension
const MV_RULES = [
  // x^2, σ^2, (1+r)^n, e^(rT), 10^{-3}
  [/([\w)\]Ͱ-Ͽ])\^(\{[^{}]{1,12}\}|\([^()]{1,12}\)|[−-]?\w{1,4})/g, (m, b, e, ph) => b + ph(`<sup style="${MV_S}">${mvScript(e.replace(/^[{(]|[})]$/g, ""))}</sup>`)],
  // x_t, e_{t-1}, ε_it, y_t-1  (a single letter, then _)
  [/(^|[^\w.])([A-Za-zͰ-Ͽ])_(\{[^{}]{1,10}\}|[A-Za-z0-9]{1,3}(?:[−-]\d)?)/g, (m, p, b, s, ph) => p + ph(mvVar(b, s.replace(/^\{|\}$/g, "")))],
  // regression variables: X1, x1i, X2i, y1, Y3t
  [new RegExp("(^|[^\\w.])([xXyY])(\\d{1,2})([it](?:[−-]\\d)?)?" + MV_END, "g"), (m, p, b, d, s, ph) => p + ph(mvVar(b, d + (s || "")))],
  // xt, yi, Yt, xt-1 (not Xi/Yi, which are names)
  [new RegExp("(^|[^\\w.])([xy][it]|[XY]t)([−-]\\d)?" + MV_END, "g"), (m, p, v, s, ph) => p + ph(mvVar(v[0], v.slice(1) + (s || "")))],
  // coefficients b0, b1 … and β0, α1, γ2, λ1

  // error terms: εt, εi, εit, εt-1 always; et/ei/eit only when clearly a variable (et-1, eit, "et =")
  [new RegExp("(^|[^\\w.])(ε)(it|t|i)([−-]\\d)?" + MV_END, "g"), (m, p, b, s, l, ph) => p + ph(mvVar(b, s + (l || "")))],
  [new RegExp("(^|[^\\w.])e(t|i)([−-]\\d)" + MV_END + "|(^|[^\\w.])e(it)" + MV_END + "|(^|[^\\w.])e(t)(?=\\s*=)", "g"),

  // R2 → R², σ2 → σ²

function fmtPlain(t) {
  const keep = [], ph = (h) => String.fromCharCode(0xE100 + keep.push(h) - 1);
  for (const [re, fn] of MV_RULES) t = t.replace(re, (...a) => fn(...a.slice(0, fn.length - 1), ph));

// ------------------------------------------------------------------ the dependency diagram
const DG = { W: 218, GAP: 72, NH: 30, VG: 9, HH: 50, PAD: 18, TOP: 16 };
function diagram(v) {
  const mods = v.keys.map((k) => MODS.get(k));
  const maxN = Math.max(1, ...mods.map((m) => m.concepts.length));
  const W = DG.PAD * 2 + mods.length * DG.W + (mods.length - 1) * DG.GAP;
  const H = DG.PAD + DG.HH + DG.TOP + maxN * (DG.NH + DG.VG) + DG.PAD;
  const colX = (ci) => DG.PAD + ci * (DG.W + DG.GAP);
  const nodeY = (i) => DG.PAD + DG.HH + DG.TOP + i * (DG.NH + DG.VG);
  const col = new Map(mods.map((m, ci) => [m.key, ci]));
  const box = (id) => { const [k, i] = id.split("::"); const ci = col.get(k);
    return i === "h" ? { x: colX(ci), y: DG.PAD, h: DG.HH, ci } : { x: colX(ci), y: nodeY(+i), h: DG.NH, ci }; };
  // edges inside the volume: prerequisite -> concept that builds on it
  const edges = new Map();
  mods.forEach((m) => m.concepts.forEach((c, i) => c.refs.forEach((r) => {
    if ((r.kind !== "concept" && r.kind !== "module") || r.mod.vol !== v || !col.has(r.mod.key)) return;
    const from = r.kind === "concept" ? `${r.mod.key}::${r.i}` : `${r.mod.key}::h`, to = `${m.key}::${i}`;
    if (from !== to) edges.set(from + ">" + to, [from, to]);
  })));
  const path = (a, b) => {
    const A = box(a), B = box(b);
    let sx, sy = A.y + A.h / 2, ex, ey = B.y + B.h / 2, c1, c2;
    if (A.ci < B.ci) { sx = A.x + DG.W; ex = B.x - 2; const d = Math.max(28, (ex - sx) / 2); c1 = sx + d; c2 = ex - d; }
    else if (A.ci > B.ci) { sx = A.x; ex = B.x + DG.W + 2; const d = Math.max(28, (sx - ex) / 2); c1 = sx - d; c2 = ex + d; }
    else { sx = A.x; ex = B.x - 2; const d = 22 + Math.min(40, Math.abs(ey - sy) * 0.12); c1 = sx - d; c2 = ex - d; }
    return `M${sx},${sy} C${c1},${sy} ${c2},${ey} ${ex},${ey}`;
  };
  const edgeSvg = [...edges.values()].map(([a, b]) => `<path class="edge" data-a="${esc(a)}" data-b="${esc(b)}" d="${path(a, b)}" marker-end="url(#arr)"/>`).join("");
  const lanes = [];
  const cols = mods.map((m, ci) => {
    const x = colX(ci), title = m.title || m.key;
    const head = `<g class="mh" data-mod="${esc(m.key)}"><title>${esc(m.key)}: ${esc(title)}</title>
      <rect x="${x}" y="${DG.PAD}" width="${DG.W}" height="${DG.HH}" rx="10"/>
      <text class="k" x="${x + 12}" y="${DG.PAD + 19}">MODULE ${m.n}</text><text class="t" x="${x + 12}" y="${DG.PAD + 38}">${esc(clip(title, 31))}</text></g>`;
    const lane = `<rect class="lane" x="${x - 8}" y="${DG.PAD + DG.HH + 6}" width="${DG.W + 16}" height="${H - DG.PAD * 2 - DG.HH - 6}" rx="12"/>`;
    const nodes = m.concepts.length ? m.concepts.map((c, i) => {
      const y = nodeY(i), id = `${m.key}::${i}`;
      const outs = [...new Map(c.refs.filter((r) => (r.kind === "concept" || r.kind === "module") && r.mod.vol !== v)
        .map((r) => [r.mod.key, `${r.mod.vol.abbr} ${r.mod.n}`])).values()];
      const tagText = outs.length ? outs[0] + (outs.length > 1 ? ` +${outs.length - 1}` : "") : "";
      const tagW = tagText ? tagText.length * 6.2 + 10 : 0;
      const maxChars = Math.floor((DG.W - 20 - (tagW ? tagW + 6 : 0)) / 6.3);
      const tip = `${c.name} — ${c.what || ""}${c.refs.length ? `\nBuilds on: ${c.refs.map((r) => r.raw).join("; ")}` : ""}`;
      return `<g class="node" data-id="${esc(id)}" tabindex="0" role="link" aria-label="${esc(c.name)}"><title>${esc(tip)}</title>
        <rect x="${x}" y="${y}" width="${DG.W}" height="${DG.NH}" rx="8"/>
        <text x="${x + 10}" y="${y + 19.5}">${esc(clip(c.name, maxChars))}</text>
        ${tagText ? `<g class="tag"><title>Builds on another volume: ${esc(outs.join(", "))}</title><rect x="${x + DG.W - tagW - 6}" y="${y + 7}" width="${tagW}" height="16" rx="4"/>
          <text x="${x + DG.W - tagW - 1}" y="${y + 19}">${esc(tagText)}</text></g>` : ""}</g>`;
    }).join("") : `<text class="none" x="${x + 12}" y="${nodeY(0) + 19}">Not mapped yet</text>`;
    lanes.push(lane);
    return head + nodes;
  }).join("");
  return `<div class="dgwrap"><div class="dgscroll" id="dgscroll"><svg class="dg" id="dg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(v.name)} concept dependency diagram">
      <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arr" d="M0,0 L8,4 L0,8 z"/></marker>
        <marker id="arr-on" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="arr-on" d="M0,0 L8,4 L0,8 z"/></marker></defs>
      ${lanes.join("")}<g id="dgedges">${edgeSvg}</g>${cols}</svg></div></div>
    <div class="dglegend"><span><span class="sw"></span>arrow: prerequisite → the concept that builds on it</span><span><span class="tg">FSA 1</span>also builds on another volume</span>
      <span>Hover or tap-and-hold a concept to trace its links · click to open its module</span></div>`;
}
function wireDiagram() {
  const svg = $("dg"), sc = $("dgscroll");
  if (!svg) return;
  const edges = [...svg.querySelectorAll(".edge")];
  const focus = (id) => {
    svg.classList.toggle("focus", !!id);
    const on = new Set(id ? [id] : []);
    for (const e of edges) {
      const hit = id && (e.dataset.a === id || e.dataset.b === id);
      e.classList.toggle("on", !!hit);

    // highlighted links go on top of the nodes; the rest stay underneath
    const under = svg.querySelector("#dgedges");
    for (const e of edges) (e.classList.contains("on") ? svg : under).appendChild(e);
  };
  svg.addEventListener("mouseover", (e) => { const n = e.target.closest(".node"); focus(n ? n.dataset.id : null); });
  svg.addEventListener("mouseleave", () => focus(null));

// Drag to pan the diagram with a mouse (touch scrolls natively). One set of window listeners for the page's lifetime.
const PAN = { drag: null, moved: false };
window.addEventListener("mousemove", (e) => {
  const d = PAN.drag; if (!d) return;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;

  d.sc.scrollLeft = d.l - dx; d.sc.scrollTop = d.t - dy;
});
window.addEventListener("mouseup", () => { if (PAN.drag) PAN.drag.sc.classList.remove("drag"); PAN.drag = null; setTimeout(() => (PAN.moved = false), 0); });

// chips that open a pop-up (the href is where "open" goes, and what a new tab gets)
function gchip(r, here) {
  if (r.kind === "concept") {
    const c = r.mod.concepts[r.i];
    return `<a class="chip" href="${esc(ghref(r.mod, "c" + r.i))}" data-pop="${esc(`con:${r.mod.key}|${r.i}`)}" aria-haspopup="dialog">${esc(c.name)}${r.mod !== here ? ` · ${esc(r.mod.vol.abbr)} ${r.mod.n}` : ""}</a>`;
  }
  if (r.kind === "module") return modChip(r.mod, here, r.label);
  if (r.kind === "level1") return `<span class="chip l1" title="Level I">Level I: ${esc(r.label)}</span>`;
  return `<span class="chip plain">${esc(r.label || r.raw)}</span>`;
}
const modChip = (t, here, label) => `<a class="chip ${here && t.vol !== here.vol ? "out" : ""}" href="${esc(ghref(t))}" data-pop="${esc("mod:" + t.key)}" aria-haspopup="dialog">${esc(t.vol.short)} ${t.n}${
  label ? ": " + esc(clip(label, 40)) : t.title ? ": " + esc(clip(t.title, 34)) : ""}</a>`;
const missText = (x) => { const s = String(x || "").trim(), m = s.match(/^thinks?\s+(?:that\s+)?(.+)$/i); return m ? `Thinking ${m[1]}` : s.charAt(0).toUpperCase() + s.slice(1); };

// Everything a module leans on and feeds, from the concept map: prerequisite modules, Level I topics, modules that build on it.
function fitOf(m) {
  const before = new Set(), after = new Set(), level1 = new Map();
  const take = (r) => { if ((r.kind === "concept" || r.kind === "module") && r.mod !== m) before.add(r.mod.key); else if (r.kind === "level1") level1.set(norm(r.label), r.label); };
  m.concepts.forEach((c) => { c.refs.forEach(take); c.usedBy.forEach((u) => u.mod !== m && after.add(u.mod.key)); });
  m.frefs.forEach((rs) => rs.forEach(take));
  const book = (s) => [...s].map((k) => MODS.get(k)).filter(Boolean).sort((a, b) => ORDER.indexOf(a.key) - ORDER.indexOf(b.key));
  return { before: book(before), after: book(after), level1: [...level1.values()] };
}

// normItems: a list of tips, pitfalls or steps -> clean items. One string holding several lines is split (steps: by paragraph, or by line
// with formula lines kept under their sentence); indented items continue the one before; "Step 2:" / "1." prefixes go (the page numbers them).
function normItems(x, steps) {
  let items = arr(x).map((s) => (typeof s === "string" ? s : s && typeof s === "object" ? s.text || s.step || s.body || "" : "")).filter((s) => s.trim());
  let byLine = false;
  if (items.length === 1 && items[0].trim().includes("\n")) {
    const one = items[0].trim(), paras = steps && /\n\s*\n/.test(one);
    items = paras ? one.split(/\n\s*\n/) : one.split("\n");
    byLine = !paras;
  }
  const out = [];
  for (const s of items) {
    const prev = out[out.length - 1];
    const cont = prev !== undefined && s.trim() && (/^[ \t]+\S/.test(s) ||
      (steps && byLine && (/:\s*$/.test(prev) || (/^[A-Za-z\\][\w{}\\^₀-₉]*\s*=/.test(s.trim()) && !/[.!?]\s*$/.test(prev)))));
    if (cont) out[out.length - 1] = prev + "\n" + s.trim(); else if (s.trim()) out.push(s.trim());
  }
  return out.map((s) => s.replace(steps ? /^(?:step\s*\d+\s*[:.)\-–]?|\d{1,2}[.)])\s*/i : /^(?:\d{1,2}[.)]|[-*•])\s+/, "").trim()).filter(Boolean);
}
function narrExample(n, ctx) {
  const ex = n.worked_example;
  if (typeof ex === "string") return str(ex) ? `<div class="card g-ex"><div class="rich">${rich(ex, ctx)}</div></div>` : "";
  if (!ex || typeof ex !== "object") return "";
  const steps = normItems(ex.thinking, true);
  const problem = str(ex.problem), answer = str(ex.answer);
  if (!problem && !steps.length && !answer) return "";
  return `<div class="card g-ex" data-ex>
    ${problem ? `<div><span class="lbl">Problem</span><div class="rich">${rich(problem, ctx)}</div></div>` : ""}
    ${steps.length ? `<ol class="g-steps" aria-live="polite">${steps.map((s) => `<li hidden><div class="rich">${rich(s, ctx)}</div></li>`).join("")}</ol>` : ""}
    ${answer ? `<div class="g-ex-a" hidden><span class="lbl">Answer</span><div class="rich">${rich(answer, ctx)}</div></div>` : ""}
    <div class="g-ex-ctrl"><button type="button" class="btn sm primary" data-ex="next"></button><button type="button" class="btn sm ghost" data-ex="all">Show all</button>
      <button type="button" class="btn sm ghost" data-ex="reset" hidden>Start over</button></div></div>`;
}
function exUpdate(card) {
  const steps = [...card.querySelectorAll(".g-steps > li")], ans = card.querySelector(".g-ex-a");
  const nextStep = steps.findIndex((li) => li.hidden), done = nextStep < 0 && (!ans || !ans.hidden);
  const next = card.querySelector('[data-ex="next"]'), all = card.querySelector('[data-ex="all"]'), reset = card.querySelector('[data-ex="reset"]');
  next.hidden = all.hidden = done; reset.hidden = !done;
  all.hidden = done || steps.length < 2;
  next.textContent = nextStep >= 0 ? (nextStep === 0 ? `Show the first step (of ${steps.length})` : `Show step ${nextStep + 1} of ${steps.length}`) : "Show the answer";
}

    $("content").querySelectorAll("details").forEach((d) => { if (openIds.includes(d.id || d.querySelector("summary").textContent.slice(0, 20))) d.open = true; });
    $("content").querySelectorAll(".g-ex").forEach((c, i) => { const st = exState[i]; if (st) [...c.querySelectorAll(".g-steps > li, .g-ex-a")].forEach((x, j) => (x.hidden = st[j] ?? x.hidden)); exUpdate(c); });
    if (view === "gmod") $("content").querySelectorAll(".sec").forEach(typesetOnce);  // keep the page the same height as before
    window.scrollTo(0, y);
    const s2 = $("dgscroll"); if (s2 && dgPos) { s2.scrollLeft = dgPos[0]; s2.scrollTop = dgPos[1]; }
    return;
  }
  const at = view === "gmod" ? r.get("at") : view === "gloss" ? (r.get("t") ? "t-" + r.get("t") : r.get("l") ? "gl-" + r.get("l") : "") : view === "ghome" && r.get("vol") ? "gvol-" + r.get("vol") : "";
  const mapTarget = view === "mmod" ? (r.get("c") !== null ? "c" + r.get("c") : r.get("f") !== null ? "f" + r.get("f") : r.get("s") !== null ? "s" + r.get("s") : null) : null;
  const el = mapTarget ? document.getElementById(mapTarget) : null;
  if (el) { requestAnimationFrame(() => { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.add("flash"); }); }
  else if (at && (view === "gmod" ? goAnchor(at, false) : (() => { const t = document.getElementById(at); if (t) { requestAnimationFrame(() => { t.scrollIntoView({ block: "start" }); if (t.classList.contains("gl-entry")) t.classList.add("flash"); }); } return !!t; })())) { /* scrolled */ }
  else window.scrollTo(0, 0);
  const cur = $("nav").querySelector("a.cur");
  if (cur && window.innerWidth > 860) cur.scrollIntoView({ block: "nearest" });
}
window.addEventListener("hashchange", () => render(false));
function forceRender() { LAST = { view: "", key: "" }; render(false); }  // same module, new content: rebuild it (and start at the top)

// ------------------------------------------------------------------ search
let hits = [], sel = 0;
const hrefOf = (s) => (s.type === "term" ? "#glossary&t=" + encodeURIComponent(s.id) : MODE === "guide" ? ghref(s.mod, s.at) : href(s.mod, s.mx));
function search(q) {
  const words = norm(q).split(" ").filter(Boolean);
  if (!words.length) return [];
  const scored = [];
  for (const s of SEARCH) {
    const inName = words.every((w) => s.n.includes(w));
    const inAll = inName || words.every((w) => s.n.includes(w) || s.x.includes(w));
    if (!inAll) continue;
    const score = (inName ? 0 : 10) + (s.n.startsWith(words[0]) ? 0 : 2) + { formula: 0, standard: 0, concept: 1, term: 2, module: 3 }[s.type];
    scored.push([score, s]);
  }
  return scored.sort((a, b) => a[0] - b[0]).slice(0, 40).map((x) => x[1]);
}
function drawResults() {
  const box = $("results"), q = $("q").value.trim();
  if (!q) { box.classList.remove("show"); return; }
  box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${esc(hrefOf(h))}" class="${i === sel ? "sel" : ""}"><span class="rt">${h.type}</span>
      <span class="rl">${esc(h.label)}</span><span class="rm">${h.mod ? `${esc(h.mod.vol.abbr)} ${h.mod.n}` : "Glossary"}</span></a>`).join("")
    : `<div class="empty">Nothing matches “${esc(q)}” yet.</div>`;
  box.classList.add("show");
  const s = box.querySelector("a.sel"); if (s) s.scrollIntoView({ block: "nearest" });
}
$("q").addEventListener("input", () => { hits = search($("q").value); sel = 0; drawResults(); });
$("q").addEventListener("focus", () => { if ($("q").value.trim()) drawResults(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { sel = Math.min(hits.length - 1, sel + 1); drawResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); drawResults(); e.preventDefault(); }
  else if (e.key === "Enter" && hits[sel]) { const h = hrefOf(hits[sel]); closeSearch(); if (location.hash === h) render(false); else location.hash = h; }
  else if (e.key === "Escape") { $("q").value = ""; closeSearch(); }
});
function closeSearch() { $("results").classList.remove("show"); $("q").blur(); }
$("results").addEventListener("click", (e) => { const a = e.target.closest("a"); if (a) { closeSearch(); if (location.hash === a.getAttribute("href")) render(false); } });
document.addEventListener("click", (e) => { if (!e.target.closest(".search")) $("results").classList.remove("show"); });


const GLOSS_P = fetchJSON("static/glossary.json").then(setGlossary).catch(() => { GLOSS_FAILED = true; });
const NARR_P = loadNarratives();
const HUB_P = loadHub();
let LOADED_AT = 0;
async function load() {
  const live = $("live");
  if (document.hidden && DATA) return;  // the page is in the background: refresh when it's looked at again
  try {
    const r = await fetch("mapdata", { cache: "no-store" });
    const d = await r.json();
    LOADED_AT = Date.now();
    const key = JSON.stringify([d.concepts, d.formulas, d.guide, d.memory]);
    const first = !DATA;
    if (key !== DATAKEY) {
      const before = LAST.view === "gmod" && MODS.get(LAST.key) ? MODS.get(LAST.key).sig : null;
      if (first) await Promise.race([Promise.allSettled([GLOSS_P, NARR_P, window.PATH_P || 0, window.LOS_P || 0]), sleep(2500)]);  // the small files, so the first page has its links
      DATA = d; DATAKEY = key; build(d); buildLinks();
      if (first) render(false);
      else if (MODE === "path") drawNav();  
      else if (before !== null && MODS.get(LAST.key) && MODS.get(LAST.key).sig === before) drawNav();  // the module you're reading didn't change
      else if (POP.open && POP.pinned) PENDING = true;  // don't pull the page out from under an open pop-up
      else render(true);
      if ($("q").value.trim()) { hits = search($("q").value); drawResults(); }
    }
    live.className = "live";
    live.innerHTML = "<i></i>Copy from 2026-10-02";
  } catch {
    live.className = "live stale"; live.innerHTML = "<i></i>Couldn't load the data";
    if (!DATA) $("content").innerHTML = `<p class="offline">Can't load the Study Map data.</p>`;
  }
}
async function refreshNarratives() {
  const before = LAST.view === "gmod" ? JSON.stringify(NARR[LAST.key] || null) : null;
  if (!(await loadNarratives()) || !DATA) return;
  if (LAST.view === "gmod") {
    if (JSON.stringify(NARR[LAST.key] || null) !== before) {  // this module's walkthrough arrived or changed: offer it rather than move the page
      const b = $("g-banner");
      if (b && window.scrollY < 150 && !POP.open) render(true);
      else if (b) b.innerHTML = `<div class="g-banner"><span>${before === "null" ? "This module's walkthrough was updated." : "This module's walkthrough was updated."}</span>
        <button type="button" class="btn sm primary" onclick="forceRender()">Show it</button></div>`;
    }
    drawNav();
  } else if (LAST.view === "ghome" && !POP.open) render(true);
  else drawNav();
}
GLOSS_P.then(() => { if (DATA) { buildLinks(); if (LAST.view === "gloss") render(false); } });
setStick();
load();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (Date.now() - LOADED_AT > 25000) load();
  if (Date.now() - NARR_AT > 60000) refreshNarratives();
  loadHub();
});
</script>
</body>
