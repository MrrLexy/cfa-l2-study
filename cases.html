<style>
  :root { --page-max: 1320px; }
  main { max-width: var(--page-max); margin: 0 auto; padding: var(--sp-6) var(--gutter) var(--sp-8); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
  .offline { display: none; margin-top: var(--sp-3); color: var(--bad); font-size: var(--fs-sm); }
  h1.site-title { font-size: var(--fs-xl); letter-spacing: -.02em; }
  .lede { color: var(--muted); font-size: var(--fs-md); margin: 6px 0 0; max-width: 760px; }

  /* picker */
  .picker { margin-top: var(--sp-6); }
  .step { margin-top: var(--sp-5); }
  .step:first-child { margin-top: 0; }
  .step > .eyebrow { display: block; margin-bottom: var(--sp-2); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: var(--r-pill); padding: 6px 14px;
          font-size: var(--fs-sm); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; }
  .pill:hover { border-color: var(--accent); }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .pill .n { font-size: var(--fs-xs); font-weight: 600; opacity: .75; font-variant-numeric: tabular-nums; }
  .modgrid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .modcard { padding: var(--sp-4); text-align: left; font: inherit; color: inherit; width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .modcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .modcard .name { font-weight: 700; }
  .modcard .facts { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .setgrid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .setcard { padding: var(--sp-4); display: flex; flex-direction: column; gap: 8px; }
  .setcard .t { font-weight: 700; font-size: 16.5px; line-height: 1.3; }
  .setcard .src { font-size: 13px; color: var(--muted); }
  .setcard .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
  .setcard .go { font-size: 13px; font-weight: 600; color: var(--accent); }

  /* one set */
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: var(--sp-5); font-size: var(--fs-sm); color: var(--muted); }
  .sethead { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; margin: var(--sp-3) 0 var(--sp-5); }
  .sethead h2 { font-size: var(--fs-xl); line-height: 1.2; letter-spacing: -.015em; margin: 0 0 4px; }
  .sethead .src { color: var(--muted); font-size: 15px; margin: 0; }
  .score { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
  .score b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1; }
  .score .progress { width: 120px; }
  .case { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: var(--sp-5); align-items: start; }
  .vig { position: sticky; top: var(--sp-3); max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; padding: 0; }
  .vig > summary { list-style: none; cursor: default; padding: var(--sp-4) var(--sp-5) 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .vig > summary::-webkit-details-marker { display: none; }
  .vig > summary .tog { display: none; }
  .vig .body { padding: var(--sp-2) var(--sp-5) var(--sp-5); }
  .qs { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }
  .q { padding: var(--sp-5); scroll-margin-top: 16px; }
  .q .qh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: var(--sp-2); }
  .q .stem { font-size: 16.5px; font-weight: 600; line-height: 1.45; }
  .q .stem p { margin: 0 0 .5em; } .q .stem p:last-child { margin-bottom: 0; }
  .opts { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-4); }
  .opt { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; cursor: pointer;
         border: 1.5px solid var(--line-strong); background: var(--card); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: 15.5px; line-height: 1.45; min-height: 48px; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt .L { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
            background: var(--sunk); color: var(--muted); }
  .opt .v { padding-top: 2px; overflow-wrap: anywhere; }
  .opt .v p { margin: 0; }
  .opt.right { border-color: var(--good); background: var(--good-soft); }
  .opt.right .L { background: var(--good); color: var(--card); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .L { background: var(--bad); color: var(--card); }
  .opt.dim { opacity: .62; }
  .verdict { margin-top: var(--sp-4); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
  .expl { margin-top: var(--sp-2); background: var(--sunk); border-radius: var(--r); padding: var(--sp-3) var(--sp-4); font-size: 15px; }
  .expl p { margin: 0 0 .6em; } .expl p:last-child { margin-bottom: 0; }
  .los { font-size: 13px; color: var(--muted); margin-top: var(--sp-2); }
  .trap { margin-top: var(--sp-2); border-left: 3px solid var(--warn, #c98a1b); background: var(--sunk); border-radius: var(--r); padding: var(--sp-3) var(--sp-4); font-size: 15px; }
  .trap p { margin: 0 0 .4em; } .trap p:last-child { margin: 0; }
  .walk { margin-top: var(--sp-3); border: 1px solid var(--line); border-radius: var(--r); padding: var(--sp-3) var(--sp-4); }
  .walk ol { margin: 6px 0 0; padding-left: 22px; } .walk li { margin: 0 0 6px; } .walk li:last-child { margin: 0; }
  .walk .md p { margin: 0; }
  .varbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); margin: calc(-1 * var(--sp-3)) 0 var(--sp-4); }
  .varbar .vnote { font-size: 14px; color: var(--muted); }
  .look > summary { padding: var(--sp-3) var(--sp-4); cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; }
  .look > summary::-webkit-details-marker { display: none; }
  .look .body { padding: 0 var(--sp-4) var(--sp-3); font-size: 15px; }
  .look ul { margin: 0; padding-left: 1.2em; } .look li { margin-bottom: 4px; }
  .exambox { padding: var(--sp-4); display: flex; flex-wrap: wrap; gap: var(--sp-3); justify-content: space-between; align-items: center; margin-bottom: var(--sp-4); }
  .exambox p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; max-width: 60ch; }
  .exambox .row, .xhead .row { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: center; }
  .xhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-3); align-items: center; margin: var(--sp-3) 0 var(--sp-4); }
  .xhead .clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
  .xhead .clock.over { color: var(--bad); }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .xres { display: grid; gap: var(--sp-4); }
  .xres .big { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .xres table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .xres th, .xres td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .xres td.r, .xres th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .setfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--sp-2); margin-top: var(--sp-2); }
  /* an item set laid out as on the exam: the vignette on the left, one question at a time on the right, each side scrolling on its own */
  .grow { flex: 1 1 auto; }
  .case.one { align-items: stretch; }
  .lpane { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
  .lpane > * { flex: none; }
  .case.one .vig { position: static; max-height: none; overflow: visible; }
  .lpane .look { padding: 0; }
  .lpane .look > summary { padding: 8px var(--sp-4); }
  .case .rpane { display: flex; flex-direction: column; min-width: 0; padding: 0; }
  .qnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); }
  .qtab { min-width: 46px; height: 34px; padding: 0 10px; border-radius: var(--r-sm); border: 1.5px solid var(--line-strong); background: var(--card); color: var(--ink);
          font: inherit; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; cursor: pointer; }
  .qtab:hover { border-color: var(--accent); }
  .qtab.ok { border-color: var(--good); color: var(--good); } .qtab.bad { border-color: var(--bad); color: var(--bad); } .qtab.done { background: var(--sunk); }
  .qtab.flag { box-shadow: inset 0 -3px 0 var(--warn, #c98a1b); }
  .qtab[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .rscroll { flex: 1 1 auto; min-height: 0; padding: var(--sp-4) var(--sp-5); }
  .rpane .q { padding: 0; }
  .qbar { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--line); font-size: 14px; }
  .optrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
  .optrow > .opt:only-child { grid-column: 1 / -1; }
  .strike { width: 38px; border: 1.5px solid var(--line); border-radius: var(--r); background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  .strike:hover, .strike[aria-pressed="true"] { border-color: var(--line-strong); color: var(--ink); }
  .opt.struck { opacity: .55; } .opt.struck .v { text-decoration: line-through; }
  @media (min-width: 961px) {
    body.inset main { padding-top: var(--sp-3); padding-bottom: var(--sp-3); }
    body.inset .site-head, body.inset h1.site-title, body.inset .sethead .src { display: none; }
    body.inset .crumbs { margin-top: 0; }
    body.inset .sethead { margin: var(--sp-2) 0 var(--sp-3); align-items: center; } body.inset .sethead h2 { font-size: var(--fs-lg); margin: 0; }
    body.inset .varbar { margin: calc(-1 * var(--sp-2)) 0 var(--sp-3); }
    body.inset .xhead { margin: 0 0 var(--sp-3); }
    .case.one { height: var(--ws-h, 72vh); grid-template-rows: minmax(0, 1fr); }
    .case.one .lpane, .case.one .rpane { min-height: 0; }
    .case.one .lpane, .case.one .rscroll { overflow-y: auto; overscroll-behavior: contain; }
  }
  .jump { display: none; }
  .qbtns { display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .tienote { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }
  .vig .tienote { margin: 0 0 10px; }

  /* markdown content */
  .md { font-size: 15.5px; line-height: 1.6; overflow-wrap: break-word; }
  .md p { margin: 0 0 .8em; }
  .md h3, .md h4, .md h5 { font-size: 15.5px; margin: 1.2em 0 .5em; }
  .md ul, .md ol { margin: 0 0 .8em; padding-left: 1.4em; }
  .md li { margin: .2em 0; }
  .md .table-wrap { margin: .4em 0 1em; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
  .md .table { font-size: 14.5px; }
  .md .table th { white-space: normal; background: var(--sunk); text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
  .md .table td { padding: 8px 10px; }
  .md .table td.r, .md .table th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .md .table td.c, .md .table th.c { text-align: center; }
  .md .cap { font-weight: 700; font-size: 14px; margin: 1.1em 0 .3em; }
  .md code { font-family: var(--mono); font-size: .9em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
  .katex { font-size: 1.06em; }
  .katex-display { margin: .5em 0; padding: .4em .6em; background: var(--sunk); border-radius: var(--r-sm); overflow-x: auto; overflow-y: hidden; }
  .expl .katex-display { background: var(--card); }

  @media (max-width: 960px) {
    .case { grid-template-columns: minmax(0, 1fr); }
    .vig { position: static; max-height: none; overflow: visible; }
    .vig > summary { cursor: pointer; padding-bottom: var(--sp-4); }
    .vig[open] > summary { padding-bottom: 0; }
    .vig > summary .tog { display: inline-flex; }
    .jump { display: inline-flex; }
  }
  @media (max-width: 520px) {
    main { padding-top: var(--sp-5); }
    .q, .card { padding: var(--sp-4); }
    .vig { padding: 0; }
    .vig > summary { padding: var(--sp-3) var(--sp-4); }
    .vig[open] > summary { padding-bottom: 0; }
    .vig .body { padding: var(--sp-2) var(--sp-4) var(--sp-4); }
    .score .progress { width: 80px; }
    .md .table { font-size: 13.5px; }
    .md .table td, .md .table th { padding: 7px 7px; }
  }
</style>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;

// ------------------------------------------------------------------ saved answers (this device only)
const STORE = "site-cases-v1", NAV = "site-cases-nav";
function loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v && typeof v === "object" ? v : d; } catch { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
let answers = loadJSON(STORE, {});   // "file/setId" -> { questionId: "A" }
let nav = loadJSON(NAV, {});         // { vol, mod, set }

// ------------------------------------------------------------------ trace the numbers (static/ties.js)
// The same value gets the same colour in the vignette, the question and the worked solution, so the reader sees where each
// number comes from and where it goes. Filled marks are values the case gives; outlined ones were worked out on the way.
const TIEPREF = "site-ties";
let tiesOn = (() => { try { return localStorage.getItem(TIEPREF) !== "off"; } catch { return true; } })();
let TIE = null, TIE_GIVEN = false;   // what md() marks while it renders, and whether only the values the case gives count
let tieQ = null;                     // the question whose values the vignette shows
const hinted = new Set();            // questions not answered yet whose "which numbers?" hint was asked for
const tieCache = new WeakMap();
const walking = (id) => !!(window.Walk && Walk.active(id));   // the guided walkthrough (static/walk.js) shows the number marks even when they are off
if (window.Ties) Ties.style();
function tiesFor(set, q) {
  if (!window.Ties) return null;
  if (!tieCache.has(q)) tieCache.set(q, Ties.build({ source: [set.vignette, q.stem], solution: [...(q.steps || []), q.explanation, q.trap, q.avoid], options: Object.values(q.options || {}) }));
  return tieCache.get(q);
}
function mdT(src, t, givenOnly) { TIE = t && t.groups.length ? t : null; TIE_GIVEN = !!givenOnly; try { return md(src); } finally { TIE = null; } }
function vigHTML(set, a) {
  const n = (set.questions || []).findIndex((q) => q.id === tieQ && (a[q.id] || hinted.has(q.id)));
  const t = n >= 0 && (tiesOn || walking(set.questions[n].id)) ? tiesFor(set, set.questions[n]) : null;
  return (t && t.given ? `<p class="tienote">Highlighted: the values question ${n + 1} uses.</p>` : "") + mdT(set.vignette, t && t.given ? t : null, true);
}
const tieKey = (live) => `<div class="tiekey"><button type="button" class="btn ghost sm" data-ties aria-pressed="${live}">Trace the numbers: ${live ? "on" : "off"}</button>${live
  ? `<span><mark class="tie tg h0">12</mark> given in the case</span><span><mark class="tie td h2">12</mark> worked out on the way</span><span>Click a number to follow it.</span>` : ""}</div>`;
function showVig(set) {   // the vignette alone, when the question it follows changes
  const body = document.querySelector("#vig .body");
  document.querySelectorAll(".tie-focus").forEach((el) => Ties.focus([el], null));
  if (body) body.innerHTML = vigHTML(set, answers[key(find().v, set)] || {});
  if (window.Walk) Walk.refresh();
}

if (window.Walk) Walk.provide((id) => {
  const f = find(), Q = (f.set && f.set.questions) || [], n = Q.findIndex((x) => x.id === id);
  if (n < 0 || nav.exam) return null;
  const got = (answers[key(f.v, f.set)] || {})[id];
  return { q: Q[n], module: f.set.module, t: tiesFor(f.set, Q[n]), n: n + 1, got, root: () => $("q-" + id), vig: () => $("vig"), pane: () => $("lpane"), scroller: () => $("rscroll"), render: md,
    redraw: () => { tieQ = id; const y = window.scrollY; draw(true); window.scrollTo(0, y); } };
});

// ------------------------------------------------------------------ Markdown (paragraphs, lists, headings, tables) + KaTeX
function math(tex, display) {
  if (!window.katex) return esc(display ? `\\[${tex}\\]` : `\\(${tex}\\)`);
  try { return katex.renderToString(tex, { displayMode: display, throwOnError: false, ...(window.Ties ? Ties.katexOptions : {}) }); } catch { return esc(tex); }
}
function inline(s, slots) { return TIE ? Ties.html(inline0(TIE.text(s, TIE_GIVEN), slots)) : inline0(s, slots); }
function inline0(s, slots) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<em>$2</em>")
    .replace(/\u0001(\d+)\u0002/g, (_, i) => slots[+i]);
}
const NUMERIC = /^[\s(−\-+$€£]*[\d.,]+\s*(%|bp|bps|x|×|years?|yrs?|m|mn|bn|million|billion)?\)?\s*$|^[−\-–]+$|^n\/?a$/i;
function table(rows, slots) {
  const split = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const head = split(rows[0]), sep = rows[1] && /^\s*\|?[\s:\-|]+\|?\s*$/.test(rows[1]) ? split(rows[1]) : null;

  const was = $("rscroll") ? $("rscroll").dataset.q : "";
  xDrawn = k;
  const full = (x) => x.s.questions.every((y) => (exam.picks[key(x.v, x.s)] || {})[y.id]);
  const first = !exam.at && !exam.qat, end = exam.at >= items.length - 1 && exam.qat >= Q.length - 1;
  const card = `<article class="q"><div class="qh"><span class="eyebrow">Question ${exam.qat + 1} of ${Q.length}</span>
      <span class="qbtns"><button type="button" class="btn ghost sm jump" data-jump>Vignette ↑</button></span></div><div class="stem">${md(q.stem)}</div>
    ${optRows(q, (L) => got[q.id] === L ? "picked" : "", (L) => `data-xq="${esc(q.id)}" data-xopt="${esc(L)}"`, true, md)}</article>`;
  inset(true);
  $("view").innerHTML = `<div class="xhead"><div><span class="eyebrow">Exam box · set ${exam.at + 1} of ${items.length}</span>
      <div class="pills" style="margin-top:6px">${items.map((x, i) => `<button type="button" class="pill" data-xat="${i}" aria-pressed="${i === exam.at}">${i + 1}${full(x) ? " ✓" : ""}</button>`).join("")}</div></div>
    <div class="row"><span class="clock" id="clock"></span><button type="button" class="btn" data-xback>Leave (keeps your place)</button><button type="button" class="btn primary" data-xdone>Finish and mark</button></div></div>
    <div class="case one" id="ws">
      <div class="lpane" id="lpane"><details class="card vig" id="vig" open><summary><span class="eyebrow">Vignette</span><span class="chip tog">Show / hide</span></summary><div class="body">${md(s.vignette)}</div></details></div>
      <section class="card rpane" aria-label="Question">${qTabs(Q, exam.qat, (x) => got[x.id] ? "done" : "", "data-xqat")}
        <div class="rscroll" id="rscroll" data-q="${esc(q.id)}">${card}</div>
        <div class="qbar"><button type="button" class="btn" data-xstep="-1" data-prev ${first ? "disabled" : ""}>‹ Previous</button><span class="muted">Set ${exam.at + 1} of ${items.length} · question ${exam.qat + 1} of ${Q.length}</span>
          ${end ? `<button type="button" class="btn primary" data-xdone>Finish and mark</button>` : `<button type="button" class="btn primary" data-xstep="1" data-next>Next ›</button>`}</div></section>
    </div>`;
  $("vig").querySelector("summary").addEventListener("click", (e) => { if (!matchMedia("(max-width: 960px)").matches) e.preventDefault(); });
  fitWs();
  if (old) { $("lpane").scrollTop = old.l; if (was === q.id) $("rscroll").scrollTop = old.r; }
  if (!clock) clock = setInterval(tick, 1000);
  tick();
}
function drawResults(items) {
  inset(false);
  const rows = new Map(), missed = [];
  let right = 0, total = 0;
  for (const { v, s } of items) {
    const got = exam.picks[key(v, s)] || {}, r = rows.get(v.volume) || [0, 0];
    s.questions.forEach((q, n) => {
      total++; r[1]++;
      if (got[q.id] === q.answer) { right++; r[0]++; } else missed.push({ v, s, n, q, got: got[q.id] });
    });
    rows.set(v.volume, r);
  }
  const mins = Math.round(((exam.end || Date.now()) - exam.start) / 60000);
  $("view").innerHTML = `<div class="xres"><div class="card" style="padding:var(--sp-4)"><span class="eyebrow">Exam box · results</span>
      <div class="big">${right} / ${total} <span class="muted" style="font-size:18px;font-weight:600">${total ? Math.round(100 * right / total) : 0}%</span></div>
      <div class="muted">${plural(items.length, "set")} in ${mins} min (allowed ${exam.mins}). Your answers are now saved on each set, so you can open any of them to study the worked solutions.</div>
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn primary" data-exam="${items.length >= 11 ? 11 : 5}">New session</button><button type="button" class="btn" data-xback>All sets</button></div></div>
    <div class="card" style="padding:var(--sp-4)"><table><thead><tr><th>Subject</th><th class="r">Right</th><th class="r">Questions</th></tr></thead>
      <tbody>${[...rows].map(([name, r]) => `<tr><td>${esc(name)}</td><td class="r">${r[0]}</td><td class="r">${r[1]}</td></tr>`).join("")}</tbody></table></div>
    <div class="card" style="padding:var(--sp-4)"><span class="eyebrow">What to go back to</span>
      ${missed.length ? `<table><thead><tr><th>Case</th><th>Missed</th><th></th></tr></thead><tbody>${missed.map((m) => `<tr><td>${esc(m.s.title || "")}<div class="muted" style="font-size:13px">${esc(m.s.module || "")}</div></td>
        <td>Question ${m.n + 1}${m.got ? "" : " (not answered)"}${m.q.trap ? `<div class="muted" style="font-size:14px">${md(m.q.trap).replace(/^<div class="md"><p>|<\/p><\/div>$/g, "")}</div>` : ""}</td>
        <td><a class="btn sm" href="#set=${encodeURIComponent(m.v.file + "/" + m.s.id)}" data-xopen="${esc(m.v.file)}|${esc(m.s.id)}">Review</a></td></tr>`).join("")}</tbody></table>` : `<p>Nothing missed.</p>`}</div></div>`;
}

function draw(force) {
  byKey = new Map(volumes().flatMap((v) => v.sets.map((s) => [key(v, s), { v, s }])));
  if (nav.exam && exam && volumes().length) {
    if (!force && drawnKey === "exam") return;
    $("lede").hidden = true; drawnKey = "exam"; drawExam(); if (window.Site) Site.fill($("view")); return;
  }
  const f = find();
  if (!f.v) {
    $("view").innerHTML = `<div class="empty-state" style="margin-top:24px">No item sets yet. They appear here as soon as they're written (this page checks every minute).</div>`;
    drawnKey = ""; return;
  }
  nav.vol = f.v.file; nav.mod = f.set ? f.set.module || "Other" : f.mod;
  saveJSON(NAV, nav);
  const total = volumes().reduce((n, x) => n + x.sets.length, 0);
  $("lede").textContent = `${plural(total, "item set")} across ${plural(volumes().length, "volume")}. Read the vignette, answer the four questions, then study the worked explanations. Your answers stay on this device.`;
  const k = f.set ? "set:" + key(f.v, f.set) + ":" + JSON.stringify(f.set) + JSON.stringify(answers[key(f.v, f.set)] || {}) : "pick:" + sig + JSON.stringify(nav) + JSON.stringify(answers);
  if (!force && k === drawnKey) return;
  drawnKey = k;
  $("lede").hidden = !!f.set;
  if (f.set) drawSet(f); else drawPicker(f);
  if (window.Site) Site.fill($("view"));
}

// ------------------------------------------------------------------ events
$("view").addEventListener("click", (e) => {
  const t = e.target;
  const keep = () => { const y = window.scrollY; draw(true); window.scrollTo(0, y); };
  const fl = t.closest("[data-flag]"); if (fl) { const id = fl.dataset.flag; if (flags.has(id)) flags.delete(id); else flags.add(id); return keep(); }
  const sk = t.closest("[data-strike]"); if (sk) { const [id, L] = sk.dataset.strike.split("|"), x = new Set(strikes(id)); if (x.has(L)) x.delete(L); else x.add(L); struck.set(id, x); return keep(); }
  const ex = t.closest("[data-exam]");
  if (ex) {
    const what = ex.dataset.exam;
    if (what === "resume") return go({ exam: true, set: null }, true);
    if (what === "quit") { if (confirm("End this session without marking it?")) { exam = null; saveJSON(XSTORE, null); draw(true); } return; }
    if (exam && !exam.done && !confirm("Start a new session? The one in progress is dropped.")) return;
    return startExam(+what);
  }
  if (nav.exam && exam) {
    const xo = t.closest("[data-xopt]");
    if (xo) {
      const k = exam.ids[exam.at];
      exam.picks[k] = { ...(exam.picks[k] || {}), [xo.dataset.xq]: xo.dataset.xopt }; saveJSON(XSTORE, exam);
      const y = window.scrollY; draw(true); window.scrollTo(0, y); return;
    }
    const xq = t.closest("[data-xqat]"); if (xq) { exam.qat = +xq.dataset.xqat; saveJSON(XSTORE, exam); draw(true); paneTop(); return; }
    const xs = t.closest("[data-xstep]"); if (xs) { if (!xs.disabled) stepExam(+xs.dataset.xstep); return; }
    const xa = t.closest("[data-xat]"); if (xa) { exam.at = +xa.dataset.xat; exam.qat = 0; saveJSON(XSTORE, exam); draw(true); window.scrollTo({ top: 0 }); return; }
    if (t.closest("[data-xdone]")) {
      const open = exam.ids.reduce((n, k) => n + (byKey.get(k) ? byKey.get(k).s.questions.filter((q) => !(exam.picks[k] || {})[q.id]).length : 0), 0);
      if (!open || confirm(`${open} question${open === 1 ? " is" : "s are"} not answered. Finish and mark anyway?`)) finishExam();
      return;
    }
    if (t.closest("[data-xback]")) return go({ exam: false, set: null }, true);
    const xr = t.closest("[data-xopen]"); if (xr) { e.preventDefault(); const [vol, set] = xr.dataset.xopen.split("|"); return go({ exam: false, vol, set }, true); }
    if (t.closest("[data-jump]")) { const v = $("vig"); v.open = true; v.scrollIntoView({ behavior: "smooth", block: "start" }); }
    return;
  }
  const vol = t.closest("[data-vol]"); if (vol) return go({ vol: vol.dataset.vol, mod: null, set: null });
  const mod = t.closest("[data-mod]"); if (mod) return go({ mod: mod.dataset.mod, set: null });
  const st = t.closest("[data-set]"); if (st) { e.preventDefault(); return go({ set: st.dataset.set }, true); }
  const gt = t.closest("[data-goto]"); if (gt) return go({ set: gt.dataset.goto }, true);
  if (t.closest("[data-back]")) return go({ set: null }, true);
  if (t.closest("[data-jump]")) { const v = $("vig"); v.open = true; v.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  const qa = t.closest("[data-qat]"); if (qa) { if (!qa.disabled) { qAt = +qa.dataset.qat; draw(true); paneTop(); } return; }
  const f = find();
  if (t.closest("[data-reset]") && f.set) {
    if (!confirm("Clear your answers for this set?")) return;
    delete answers[key(f.v, f.set)]; saveJSON(STORE, answers); f.set.questions.forEach((q) => { hinted.delete(q.id); flags.delete(q.id); struck.delete(q.id); }); tieQ = null; qSet = null; draw(true); return;
  }
  if (window.Ties && f.set) {
    const redraw = () => { const y = window.scrollY; draw(true); window.scrollTo(0, y); };
    if (t.closest("[data-ties]")) { tiesOn = !tiesOn; try { localStorage.setItem(TIEPREF, tiesOn ? "on" : "off"); } catch {} return redraw(); }
    const hb = t.closest("[data-hint]");
    if (hb) {
      const id = hb.dataset.hint;
      if (hinted.has(id)) { hinted.delete(id); if (tieQ === id) tieQ = null; return redraw(); }
      hinted.add(id); tieQ = id; redraw();
      if (matchMedia("(max-width: 960px)").matches) { const v = $("vig"); v.open = true; v.scrollIntoView({ behavior: "smooth", block: "start" }); }
      return;
    }
    const card = t.closest('article.q[data-t="1"]'), mark = t.closest(".tie"), inVig = t.closest("#vig");
    if (card && card.id.slice(2) !== tieQ) { tieQ = card.id.slice(2); showVig(f.set); }   // the vignette follows the question in hand
    if (mark && (card || inVig)) {
      const id = Ties.idOf(mark), home = card || (tieQ && $("q-" + tieQ));
      if (id !== null && home) { const was = mark.classList.contains("on"); document.querySelectorAll(".tie-focus").forEach((el) => Ties.focus([el], null)); if (!was) Ties.focus([home, $("vig")], id); }
      return;
    }
    if (!t.closest("[data-opt]")) document.querySelectorAll(".tie-focus").forEach((el) => Ties.focus([el], null));
  }
  const o = t.closest("[data-opt]");
  if (o && f.set && !o.disabled) {
    const k = key(f.v, f.set);
    answers[k] = { ...(answers[k] || {}), [o.dataset.q]: o.dataset.opt };
    saveJSON(STORE, answers); tieQ = o.dataset.q;
    const y = window.scrollY; draw(true); window.scrollTo(0, y);
    if (window.Walk) Walk.after(o.dataset.q);
  }
});
// with a mouse, the vignette's highlights follow the answered question the pointer is over
$("view").addEventListener("pointerover", (e) => {
  if (e.pointerType !== "mouse" || !window.Ties || !tiesOn) return;
  const card = e.target.closest('article.q[data-t="1"]'), f = card && find();
  if (card && f.set && card.id.slice(2) !== tieQ && !document.querySelector(".tie-focus")) { tieQ = card.id.slice(2); showVig(f.set); }
});
// as on the exam: right-click an answer to cross it out; the arrow keys move between questions
$("view").addEventListener("contextmenu", (e) => { const o = e.target.closest(".optrow"), b = o && o.querySelector("[data-strike]"); if (b) { e.preventDefault(); b.click(); } });
document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey || (e.key !== "ArrowRight" && e.key !== "ArrowLeft") || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "")) return;
  const b = document.querySelector(e.key === "ArrowRight" ? ".qbar [data-next]" : ".qbar [data-prev]");
  if (b && !b.disabled) { e.preventDefault(); b.click(); }
});
window.addEventListener("resize", fitWs);
window.addEventListener("storage", (e) => { if (e.key === STORE) { answers = loadJSON(STORE, {}); draw(true); } });
function fromHash() {
  const m = location.hash.match(/set=([^&]+)/);
  if (!m) return;
  const [vol, ...rest] = decodeURIComponent(m[1]).split("/");
  nav = { ...nav, vol, set: rest.join("/") };
}

// ------------------------------------------------------------------ data, refreshed every 60 s
async function load() {
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 10000);
    const r = await fetch("casedata", { cache: "no-store", signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    D = { volumes: Array.isArray(d.volumes) ? d.volumes : [] };
    sig = JSON.stringify(D.volumes.map((v) => [v.file, v.sets.map((s) => [s.id, s.module, s.title])]));
    $("offline").style.display = "none";
    $("livedot").className = "dot on";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    draw(false);
  } catch {
    $("offline").style.display = "block";
    $("livedot").className = "dot off";
    $("updated").textContent = "Offline";
    if (!D) $("view").innerHTML = `<div class="empty-state" style="margin-top:24px">The item sets couldn't be loaded.</div>`;
  }
}
function start() { fromHash(); load();  }
window.addEventListener("hashchange", () => { fromHash(); if (!location.hash) nav.set = null; draw(true); });
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
</script>
</body>
