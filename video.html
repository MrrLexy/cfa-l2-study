<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFA Level II Study · Video walkthrough</title>

<link rel="stylesheet" href="static/site.css">
<link rel="stylesheet" href="static/video.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="static/icon-180.png">
<link rel="icon" href="static/icon-192.png">
<meta name="theme-color" content="#16181f">
<script src="static/lock-config.js"></script>
<script src="static/lock.js"></script>
<script src="static/profile.js"></script>
<script>StudyProfile.guard();</script>
<script src="static/standalone.js"></script>
</head>
<body>
<div class="pv">
  <div class="pv-top"><a href="cases.html" id="back">‹ Case studies</a><div class="pv-title"><h1 id="title">Video walkthrough</h1><span class="sub" id="sub"></span></div></div>
  <div class="pv-main">
  <aside class="pv-side" id="side" aria-label="The case, the question and what it covers">
    <section class="pv-card pv-case" id="side-case" hidden aria-label="The case"><div class="pv-card-h" id="case-h">The case</div><div class="pv-vt" id="vt"></div><div class="pv-sheet" id="case-b"></div></section>
    <section class="pv-card pv-q" id="side-q" hidden aria-label="The question"><div class="pv-qhead"><div class="pv-card-h" id="q-h">The question</div><nav class="pv-qnav" id="qnav" aria-label="The questions on this case"></nav></div><div id="side-stem"></div><ol class="pv-opts" id="side-opts"></ol></section>
    <section class="pv-card pv-cov" id="side-cov" hidden aria-label="What this question covers"><div class="pv-card-h">This question covers</div><div id="side-cov-b"></div></section>
  </aside>
  <div class="pv-split" id="split" role="separator" aria-orientation="vertical" aria-label="Drag to give the case or the board more room" aria-valuemin="25" aria-valuemax="65" tabindex="0"></div>
  <div class="pv-video">
  <div class="pv-stage" id="stage">
    <svg id="board" viewBox="0 0 1280 720" role="img" aria-labelledby="board-t"><title id="board-t">Whiteboard</title>
      <defs>
        <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
        <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker>
        <clipPath id="orb-clip"><circle cx="0" cy="0" r="20"/></clipPath>
        <filter id="orb-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <g id="layer-hi"></g><g id="layer-ink"></g><g id="layer-red"></g><g id="layer-say"></g>
      <circle id="pen" r="5" fill="#5b7cfa" opacity="0"/>
      <g id="orb" transform="translate(1180 60)"><circle r="30" id="orb-halo" fill="#5b7cfa" opacity=".35" filter="url(#orb-glow)"/><circle r="22" fill="#fff"/>
        <circle r="21" fill="none" id="orb-ring" stroke="#5b7cfa" stroke-width="2"/></g>
    </svg>
  </div>
  <div class="pv-ctl">   <!-- the progress right under the board, the buttons right under it (the owner, 24 October 2026) -->
    <div class="pv-parts" id="parts" aria-label="Progress"></div>
    <div class="pv-bar">
      <button type="button" class="primary" id="play">▶ Play</button>
      <button type="button" id="prev" title="Back one step (←)">‹ Step</button>
      <button type="button" id="next" title="Forward one step (→)">Step ›</button>
      <button type="button" id="restart" title="Start again">⟲ Restart</button>
      <span class="grow"></span>
      <span class="pv-speed" role="group" aria-label="Speed"><span class="lbl">Speed</span><button type="button" id="slower" title="Slower by 0.15 (−)" aria-label="Slower">−</button><output id="speed" aria-live="polite">1.00×</output><button type="button" id="faster" title="Faster by 0.15 (+)" aria-label="Faster">+</button></span>
      <button type="button" class="tog" id="voice" aria-pressed="true" title="Voice">🔊 Voice</button>
      <button type="button" class="tog" id="caps" aria-pressed="true" title="Captions">CC</button>
      <a class="tog" id="nextq" hidden>Next question ›</a>
      <button type="button" class="tog" id="steps-t" aria-pressed="false" aria-controls="steps" title="Every step, numbered">Steps</button>
    </div>
  </div>
  <div class="pv-cap" id="cap" aria-live="polite"></div>
  <div class="pv-tip" id="tip" hidden role="note" aria-live="polite"><div class="pv-tip-h" id="tip-h">Tip</div><div id="tip-t"></div><button type="button" id="tip-x" aria-label="Close the tip">✕</button></div>   
  <div class="pv-steps" id="steps" hidden></div>
  </div>
  </div>
</div>
<script src="static/video.js"></script>
</body>
</html>
